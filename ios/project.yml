# orbit42 iOS 앱 — XcodeGen 프로젝트 정의
# 사용법: cd ios && xcodegen generate  (Orbit42.xcodeproj 는 생성물이므로 커밋하지 않음)
name: Orbit42

options:
  minimumXcodeGenVersion: "2.40.0"
  defaultLocalization: ko
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "K635G7H22M"

targets:
  Orbit42:
    type: application
    platform: iOS
    # XcodeGen 은 sources 하나로 컴파일/리소스를 자동 분류한다
    # (.xcassets/.xcprivacy 는 Resources 페이즈로 들어감).
    # 별도 `resources:` 키는 존재하지 않는 키라 조용히 무시되니 쓰지 말 것.
    sources:
      - path: Orbit42
      - path: Shared
    dependencies:
      - target: Orbit42Widget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.orbit42.app
        PRODUCT_NAME: Orbit42
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 1=iPhone, 2=iPad. iPad 는 모든 방향을 지원해야 해서
        # UISupportedInterfaceOrientations~ipad 를 따로 준다.
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.4.0"
        CURRENT_PROJECT_VERSION: 18
        ENABLE_PREVIEWS: YES
    info:
      path: Orbit42/Info.plist
      properties:
        CFBundleDisplayName: Orbit42
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        # 모바일 Google OAuth 콜백 수신용 커스텀 스킴 (orbit42://google-connected)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - orbit42
        # iPhone 은 세로 고정 유지, iPad 는 4방향 모두 지원
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # DEBUG 빌드가 http://localhost:3000 (Next.js dev 서버) 에 접속할 수 있도록 허용
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # 실기기 DEBUG가 같은 Wi-Fi의 Mac 개발 서버(LAN IP)에 접속할 때 필요
        NSLocalNetworkUsageDescription: 개발용 로컬 서버에 연결하기 위해 로컬 네트워크 접근이 필요해요.
        NSLocationWhenInUseUsageDescription: 일정 위치를 검색할 때 내 주변 결과를 먼저 보여주기 위해 위치 접근이 필요해요.
        # 관계 궤도 — 기기 캘린더 일정의 참석자(이름·이메일)로 자주 만나는 사람을 찾는다.
        NSCalendarsFullAccessUsageDescription: 캘린더 일정에 함께 있던 사람의 이름과 이메일로 자주 만나는 사람을 찾아 관계 지도를 만들어요. 상대에게는 아무것도 보내지 않아요.
        NSCalendarsUsageDescription: 캘린더 일정에 함께 있던 사람의 이름과 이메일로 자주 만나는 사람을 찾아 관계 지도를 만들어요. 상대에게는 아무것도 보내지 않아요.
        NSPhotoLibraryAddUsageDescription: 만든 예약 링크 이미지를 사진에 저장해요.
    entitlements:
      path: Orbit42/Orbit42.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        # 홈 화면 위젯과 토큰 사본·표시 설정 공유 (App Group 없이 키체인 공유만)
        # 앱 전용 그룹을 맨 앞에 둬서 기본 저장 위치는 그대로, 위젯용 사본은 shared 그룹에
        keychain-access-groups:
          - $(AppIdentifierPrefix)org.orbit42.app
          - $(AppIdentifierPrefix)org.orbit42.shared

  # 홈 화면 위젯 (WidgetKit) — 월 달력+다가오는 일정 / 오늘+내일 / 다음 일정
  Orbit42Widget:
    type: app-extension
    platform: iOS
    sources:
      - path: Orbit42Widget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.orbit42.app.widget
        PRODUCT_NAME: Orbit42Widget
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.4.0"
        CURRENT_PROJECT_VERSION: 18
        SKIP_INSTALL: YES
    info:
      path: Orbit42Widget/Info.plist
      properties:
        CFBundleDisplayName: Orbit42
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Orbit42Widget/Orbit42Widget.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)org.orbit42.shared

schemes:
  Orbit42:
    build:
      targets:
        Orbit42: all
    run:
      config: Debug
    archive:
      config: Release
